<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
    data-sly-call="${clientlib.css @ categories='mysite.team-members'}"></sly>
<sly data-sly-use.teamMembers="com.mysite.core.models.TeamMembersModel"></sly>

<div class="team-members">

    <h2 class="team-members__title">Team Members</h2>

    <div class="team-members__list" data-sly-list.member="${teamMembers.members}">

        <div class="team-members__card">

            <div class="team-members__photo-wrapper">
                <img class="team-members__photo" 
                     src="${member.photo @ context='uri'}" 
                     alt="${member.name}"
                     data-sly-test="${member.photo}">
                <div class="team-members__photo-placeholder" data-sly-test="${!member.photo}">
                    <span>${member.name ? member.name[0] : 'U'}</span>
                </div>
            </div>

            <div class="team-members__content">

                <h3 class="team-members__name">
                    ${member.name}
                </h3>

                <p class="team-members__role">
                    ${member.role}
                </p>

            </div>

        </div>

    </div>

</div>
<sly data-sly-call="${clientlib.js @ categories='mysite.team-members'}"></sly>
